<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ .Site.BaseURL }}#website",
      "url": "{{ .Site.BaseURL }}",
      "name": "{{ .Site.Params.brandName }}",
      "description": "{{ .Site.Params.description }}",
      "inLanguage": "zh-CN"
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ .Permalink }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "首页",
          "item": "{{ .Site.BaseURL }}"
        }
        {{ if not .IsHome }}
        ,
        {
          "@type": "ListItem",
          "position": 2,
          "name": "{{ if .Section }}{{ .Section }}{{ else }}{{ .Title }}{{ end }}",
          "item": "{{ if .Section }}{{ .Site.BaseURL }}{{ .Section }}/{{ else }}{{ .Permalink }}{{ end }}"
        }
        {{ if and .IsPage (ne .Section "") }}
        ,
        {
          "@type": "ListItem",
          "position": 3,
          "name": "{{ .Title }}",
          "item": "{{ .Permalink }}"
        }
        {{ end }}
        {{ end }}
      ]
    }
    {{ if .IsPage }}
    ,
    {
      "@type": "TechArticle",
      "@id": "{{ .Permalink }}#article",
      "headline": "{{ .Title }}",
      "description": "{{ if .Description }}{{ .Description }}{{ else }}{{ .Summary | plainify }}{{ end }}",
      "url": "{{ .Permalink }}",
      "inLanguage": "zh-CN",
      "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
      "publisher": {
        "@type": "Organization",
        "name": "{{ .Site.Params.brandName }}",
        "url": "{{ .Site.BaseURL }}"
      }
      {{ if .Params.brandData }}
      ,
      "review": {
        "@type": "Review",
        "reviewRating": {
          "@type": "Rating",
          "ratingValue": "{{ .Params.brandData.rating | default 9.0 }}",
          "bestRating": "10"
        },
        "author": {
          "@type": "Organization",
          "name": "{{ .Site.Params.brandName }} 实测实验室"
        }
      }
      {{ end }}
    }
    {{ end }}
  ]
}
</script>

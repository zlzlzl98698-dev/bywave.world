{{ $code := .Get "code" }}
{{ $desc := .Get "desc" }}
{{ $url := .Get "url" }}

<div style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(56, 189, 248, 0.1) 100%); border: 1px dashed rgba(16, 185, 129, 0.4); border-radius: var(--radius-md); padding: 1.25rem 1.5rem; margin: 2rem 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
  <div>
    <div style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--color-success); text-transform: uppercase; font-weight: 700; margin-bottom: 0.25rem;">
      🎁 专属限时优惠代码 (点击即可一键复制并直达)
    </div>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <span onclick="copyCoupon('{{ $code }}', '{{ $url }}')" style="cursor: pointer; font-size: 1.35rem; font-weight: 800; font-family: var(--font-mono); color: #fff; background: rgba(0,0,0,0.5); padding: 3px 12px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.3); transition: all 0.2s;" title="点击复制优惠码">
        {{ $code }} <span style="font-size: 0.75rem; color: var(--color-accent); font-weight: normal;">📋点击复制</span>
      </span>
      <span style="font-size: 0.88rem; color: var(--text-secondary);">{{ $desc }}</span>
    </div>
  </div>
  {{ if $url }}
    <button onclick="copyCoupon('{{ $code }}', '{{ $url }}')" class="btn btn-primary" style="font-size: 0.9rem;">
      一键复制并前往官网 ↗
    </button>
  {{ end }}
</div>

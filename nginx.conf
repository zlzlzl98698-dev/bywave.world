# Nginx Configuration for bywave.world
# Dark Network Observatory High-Performance Static Deployment

server {
    listen 80;
    listen [::]:80;
    server_name bywave.world www.bywave.world;
    return 301 https://bywave.world$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bywave.world;

    # SSL Certificates (Configure with Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/bywave.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bywave.world/privkey.pem;

    return 301 https://bywave.world$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bywave.world;

    root /var/www/bywave.world/public;
    index index.html index.xml;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/bywave.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bywave.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Static Assets Caching (1 Year)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML & XML Caching (Dynamic / Revalidate)
    location ~* \.(?:html|xml|json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Clean URL handling
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
